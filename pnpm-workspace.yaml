packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true

# Single TypeScript version across the workspace. typescript-eslint supports
# >=4.8.4 <6.1.0 — TypeScript 7 (native) is not yet supported by the lint
# toolchain, so we stay on the stable 5.9 line.
overrides:
  typescript: ^5.9.0
